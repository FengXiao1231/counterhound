name: False positive
description: counterhound confirmed a "bug" that is not one
labels: [false-positive]
body:
  - type: markdown
    attributes:
      value: |
        A false positive is the most useful report counterhound can get: every confirmed finding is supposed to be real. Please paste the BUG.md, it already contains the repro, the evidence and the reviewer's reasoning.
  - type: textarea
    id: bug-md
    attributes:
      label: BUG.md
      description: The file from .counterhound/runs/<id>/bugs/PH-xxx-…/BUG.md
      render: markdown
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is not a bug
      description: Where is the behaviour documented, or why is the input outside the contract?
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Language, agent and model
      placeholder: Python · claude (sonnet) · --review-model opus
